global:
  scrape_interval: 5s
  evaluation_interval: 5s

scrape_configs:
  - job_name: 'consultas_metrics'
    metrics_path: '/actuator/prometheus'

    static_configs:
      - targets: ['backend:8080']
        labels:
          application: 'consultas_API'
    basic_auth:
      username: 'prometheus'
      password: 'prometheus'