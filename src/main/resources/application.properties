    spring.application.name=Consultas

    spring.config.import=optional:file:.env[.properties]
    spring.datasource.url=${DB_URL}
    spring.datasource.username=${DB_USER}
    spring.datasource.password=${DB_PASSWORD}
    spring.jpa.hibernate.ddl-auto= validate
    spring.profiles.active= ${PROFILE}

    logging.level.root=INFO
    spring.jpa.database-platform=org.hibernate.dialect.PostgreSQLDialect
    spring.jpa.properties.hibernate.jdbc.lob.non_contextual_creation=true
    spring.jpa.properties.hibernate.generate_statistics=true

    api.security.token.secret=${JWT_SECRET}

    logging.level.com.example.consultas = TRACE
    logging.file.name = logs

    management.endpoints.web.exposure.include=health,info,prometheus,logfile
    management.endpoint.health.show-details=always
    management.prometheus.metrics.export.enabled=true
    management.metrics.tags.application=consultas
    management.metrics.distribution.percentiles-histogram.http.server.requests=true
    management.metrics.distribution.percentiles.http.server.requests=0.5,0.95,0.99

    spring.mail.username=${MAIL_USERNAME}


    spring.mail.properties.mail.smtp.auth=true
    spring.mail.properties.mail.smtp.starttls.enable=true

    spring.flyway.enabled=true
    spring.flyway.baseline-on-migrate=true
    spring.flyway.locations=classpath:db/migration

